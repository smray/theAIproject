# Reference copy of the three-tier llama-swap config from the requirements doc Part 4 S4.1.
# Deploy by replacing /opt/llama-swap/config.yaml on llm01 itself, then:
#   sudo systemctl restart llama-swap
# Adjust model filenames to whatever you actually pulled into /srv/models.
healthCheckTimeout: 180
models:
  "interactive":
    cmd: >
      /opt/llama.cpp/build/bin/llama-server --port ${PORT}
      -m /srv/models/Qwen3-30B-A3B-Instruct-2507-Q4_K_M.gguf
      -ngl 99 -c 16384 -fa on
      --cache-type-k q8_0 --cache-type-v q8_0 --parallel 1
    ttl: 600
  "fast":
    cmd: >
      /opt/llama.cpp/build/bin/llama-server --port ${PORT}
      -m /srv/models/Qwen3-8B-Q4_K_M.gguf
      -ngl 99 -c 16384 -fa on --parallel 1
    ttl: 600
  "heavy-batch":
    cmd: >
      /opt/llama.cpp/build/bin/llama-server --port ${PORT}
      -m /srv/models/Qwen3-235B-A22B-Q4_K_M-00001-of-00003.gguf
      -ngl 99 --n-cpu-moe 48 -c 8192 -fa on --parallel 1
    ttl: 1200
    # Q4_K_M is a 3-shard split (132.4 GiB total, unsloth/Qwen3-235B-A22B-GGUF). Point -m at
    # shard 1 only — llama.cpp auto-loads the other two from the same directory.
