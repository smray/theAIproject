services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports: ["3000:8080"]
    environment:
      # odysseus/lxc-gateway, 192.168.1.40 - see infra/README.md for the known-good IP table.
      - OPENAI_API_BASE_URL=http://192.168.1.40:4000/v1
      - OPENAI_API_KEY=none
      # Without this, first boot hangs indefinitely fetching the default embedding model via
      # HuggingFace's Xet CDN backend, which doesn't complete on this network (see infra/README.md).
      - HF_HUB_DISABLE_XET=1
      # Vector DB backend is selected at container startup via env var, not in the admin UI -
      # hubble/lxc-vectordb, 192.168.1.44 - see infra/lxc-vectordb/README.md.
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://192.168.1.44:6333
      # Open WebUI has no custom-CSS setting (verified against its source - see README's
      # "Branding" section), so this plain app-name string is the actual extent of branding
      # available without a reverse-proxy CSS injection or a maintained fork.
      - WEBUI_NAME=The AI Project
    volumes: ["open-webui-data:/app/backend/data"]
volumes: { open-webui-data: {} }
